services:
  # FastAPI Backend Web Service
  - type: web
    name: topstaps-api
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: "sqlite:///./homeserve.db"
      - key: SECRET_KEY
        generateValue: true
      - key: RAZORPAY_KEY_ID
        value: "rzp_test_TOPSTaps2026"
      - key: CLOUDINARY_CLOUD_NAME
        value: "dzwsbmb6"
      - key: CLOUDINARY_API_KEY
        value: "513286465541511"

