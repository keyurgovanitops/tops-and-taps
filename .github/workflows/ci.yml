name: TOPS & Taps CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run E2E Test Suite (All 10 Modules)
        env:
          DATABASE_URL: "sqlite:///./homeserve.db"
          SECRET_KEY: "ci_cd_test_secret_key_topstaps_2026"
          RAZORPAY_KEY_ID: "rzp_test_TOPSTaps2026"
        run: |
          pytest backend/tests/test_e2e_platform.py -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: ./frontend
        env:
          VITE_RAZORPAY_KEY_ID: "rzp_test_TOPSTaps2026"
        run: npm run build

